name: Release Desktop App

# Push a version tag to build the Windows installer and macOS DMG, publishing
# both to GitHub Releases. The tag must match the "version" field in
# package.json:
#   git tag v0.8.2 && git push origin v0.8.2
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # upload installer + latest.yml to the Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      # Pre-create the GitHub Release with auto-generated notes. electron-builder
      # spawns one GitHub publisher per artifact, and they race to create the
      # release (both see "doesn't exist", both POST, the loser gets
      # 422 already_exists and fails the whole job — v1.0.0 lost its .exe this
      # way). Creating it up front makes that race impossible.
      - name: Create GitHub release (if missing)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      # Builds the Vite frontend, then packages the NSIS installer and publishes it to the
      # GitHub Release for this tag (electron-builder reads the "publish"
      # config in package.json).
      - name: Build and publish installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS DMG can only be built on a Mac runner. This job runs AFTER the
  # Windows job on purpose: both jobs publish to the same GitHub Release, and
  # electron-builder is known to create duplicate draft releases when two jobs
  # create the release concurrently.
  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci

      # Universal (arm64 + x64) DMG so both Apple Silicon and Intel Macs work.
      # The app is intentionally unsigned (identity: null in package.json):
      # users bypass Gatekeeper once via right-click -> Open, and macOS
      # auto-update is unavailable without a signature — Mac users update by
      # downloading the new DMG manually.
      - name: Build and publish DMG
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
