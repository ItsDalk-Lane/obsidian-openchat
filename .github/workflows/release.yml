name: Release Desktop App

# Push a version tag to build the Windows installer and macOS DMG, publishing
# both to GitHub Releases. The tag must match the "version" field in
# package.json:
#   git tag v0.8.2 && git push origin v0.8.2
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # upload installer + latest.yml to the Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Next.js's file tracer (@vercel/nft) globs the user profile during
      # "Creating an optimized production build" when the checkout lives on a
      # different drive than the home dir. On windows-latest the repo is on D:
      # and home is on C:, so nft recurses into the deny-ACL junction
      # "C:\Users\runneradmin\Application Data" and the webpack compile dies
      # with EPERM. Building on the same drive as home avoids the walk
      # entirely (outputFileTracingRoot does NOT help — nft globs home
      # regardless). Robocopy exit codes 0-7 are success.
      - name: "Move project to C: drive"
        shell: pwsh
        run: |
          robocopy "$env:GITHUB_WORKSPACE" C:\piweb-build /MIR /XD .git node_modules .next dist-electron /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          exit 0

      - name: Verify tag matches package.json version
        working-directory: C:\piweb-build
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          }

      - name: Install dependencies
        working-directory: C:\piweb-build
        run: npm ci

      # Builds .next, then packages the NSIS installer and publishes it to the
      # GitHub Release for this tag (electron-builder reads the "publish"
      # config in package.json).
      - name: Build and publish installer
        working-directory: C:\piweb-build
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS DMG can only be built on a Mac runner. This job runs AFTER the
  # Windows job on purpose: both jobs publish to the same GitHub Release, and
  # electron-builder is known to create duplicate draft releases when two jobs
  # create the release concurrently.
  build-macos:
    needs: build-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm ci

      # Universal (arm64 + x64) DMG so both Apple Silicon and Intel Macs work.
      # The app is intentionally unsigned (identity: null in package.json):
      # users bypass Gatekeeper once via right-click -> Open, and macOS
      # auto-update is unavailable without a signature — Mac users update by
      # downloading the new DMG manually.
      - name: Build and publish DMG
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
