<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Pi Web Desktop</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a2e;
    color: #c8c8d4;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .box { text-align: center; }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 18px;
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-top-color: #7c8cf8;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 15px; font-weight: 600; letter-spacing: 0.4px; }
  .sub { margin-top: 8px; font-size: 12px; color: #8a8a9c; }
  .error-box { display: none; max-width: 420px; padding: 0 24px; }
  .error-box .title { color: #e8b4b8; }
  .error-detail {
    margin-top: 10px;
    font-size: 12px;
    color: #8a8a9c;
    word-break: break-all;
    max-height: 120px;
    overflow: auto;
  }
  .actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
  .actions button {
    background: #2a2a44;
    color: #c8c8d4;
    border: 1px solid #3d3d5c;
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 12px;
    cursor: pointer;
  }
  .actions button:hover { background: #343452; }
  .actions button.primary { background: #4c5fd5; border-color: #4c5fd5; color: #fff; }
  .actions button.primary:hover { background: #5a6de0; }
</style>
</head>
<body>
  <div class="box" id="loading-box">
    <div class="spinner"></div>
    <div class="title">Pi Web Desktop</div>
    <div class="sub">正在启动服务,请稍候…</div>
  </div>
  <div class="box error-box" id="error-box">
    <div class="title">服务启动失败</div>
    <div class="error-detail" id="error-detail"></div>
    <div class="sub" style="margin-top:10px">可以重试启动;如果端口被上次残留的进程占用,请先关闭其它 Pi Web 窗口或稍候再试。</div>
    <div class="actions">
      <button class="primary" id="retry-btn">重试</button>
      <button id="open-anyway-btn">仍然尝试打开</button>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var error = params.get("error");
      if (!error) return;
      document.getElementById("loading-box").style.display = "none";
      var box = document.getElementById("error-box");
      box.style.display = "block";
      document.getElementById("error-detail").textContent = error;
      document.getElementById("retry-btn").addEventListener("click", function () {
        box.style.display = "none";
        document.getElementById("loading-box").style.display = "block";
        if (window.piDesktop) window.piDesktop.retryStartup();
      });
      document.getElementById("open-anyway-btn").addEventListener("click", function () {
        if (window.piDesktop) window.piDesktop.openAnyway();
      });
    })();
  </script>
</body>
</html>
